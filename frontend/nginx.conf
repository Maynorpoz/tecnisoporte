server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El enrutado lo hace React en el navegador, asi que rutas como
    # /incidentes/2 no existen como archivo. Sin este try_files, recargar
    # la pagina de un detalle devuelve 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
