server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El enrutado lo hace React en el navegador, asi que rutas como
    # /incidentes/2 no existen como archivo. Sin este try_files, recargar
    # la pagina de un detalle devuelve 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las llamadas a la API pasan por aquí y nginx las reenvía al
    # contenedor de la API dentro de la red de compose. Así el frontend
    # pide siempre a /api, sin saber en qué puerto ni en qué ambiente está,
    # y la misma imagen sirve para dev, staging y prod. El navegador además
    # ve un solo origen, así que en los ambientes desplegados no hay CORS.
    location /api/ {
        proxy_pass http://api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
