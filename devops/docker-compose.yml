# Nombre del proyecto de compose, para no mezclarse con los otros
# stacks que corren en esta maquina.
name: incident-hub

services:
  db:
    image: postgres:16-alpine
    container_name: incident-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: incident_hub
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - incident_hub_data:/var/lib/postgresql/data
      # Postgres ejecuta en orden los .sql de esta carpeta, pero solo la
      # primera vez que se crea el volumen. Para recargar el esquema hay
      # que bajar el stack con -v.
      - ../database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
    container_name: incident-hub-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      # Dentro de la red de compose la base se llama db y responde en el
      # 5432, no en el 5435: ese es el puerto publicado hacia la maquina.
      DATABASE_URL: postgresql://incident_user:${POSTGRES_PASSWORD}@db:5432/incident_hub
    ports:
      - "3100:3100"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      args:
        # El navegador corre en la maquina, no dentro de la red de
        # compose, asi que la URL de la API es la publicada hacia afuera.
        VITE_API_URL: http://localhost:3100/api
    container_name: incident-hub-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  incident_hub_data:
