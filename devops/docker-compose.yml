services:
  db:
    image: postgres:16-alpine
    container_name: incident-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: incident_hub
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - incident_hub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  incident_hub_data:
