# Nombre del proyecto de compose, para no mezclarse con los otros
# stacks que corren en esta maquina.
name: incident-hub

services:
  db:
    image: postgres:16-alpine
    container_name: incident-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: incident_hub
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - incident_hub_data:/var/lib/postgresql/data
      # Postgres ejecuta en orden los .sql de esta carpeta, pero solo la
      # primera vez que se crea el volumen. Para recargar el esquema hay
      # que bajar el stack con -v.
      - ../database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  incident_hub_data:
